quarkus:
  application:
    name: isolation-back
  datasource:
    jdbc:
      url: jdbc:postgresql://localhost:5433/isolation
    db-kind: postgresql
    username: postgres
    password: password
  flyway:
    migrate-at-start: true
  smallrye-openapi:
    enable: true
  swagger-ui:
    enable: true
    always-include: true
  http:
    port: 8080
    auth:
      basic: true
  hibernate-orm:
    log:
      format-sql: true
    database:
      generation: update
  native:
    resources:
      includes: publicKey.pem
smallrye:
  jwt:
    sign:
      key:
        location: classpath:privateKey.pem
token:
  expires:
    in: 86400

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
    issuer: https://example.com/issuer
csv-location: /

"%test":
  quarkus:
    flyway:
      locations: classpath:test_db/migration/
      sql-migration-prefix: test_
    datasource:
      jdbc:
        url: jdbc:h2:mem:default
      db-kind: h2
    hibernate-orm:
      database:
        generation:
          create-schemas: true
  csv-location: /
