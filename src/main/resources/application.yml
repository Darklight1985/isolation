quarkus:
  datasource:
    jdbc:
      url: jdbc:postgresql://localhost:5433/isolation
    db-kind: postgresql
    username: postgres
    password: password
  flyway:
    migrate-at-start: true
  smallrye-openapi:
    enable: true
  swagger-ui:
    enable: true
    always-include: true
  http:
    port: 8080
    auth:
      basic: true
  hibernate-orm:
    log:
      format-sql: true
    database:
      generation: update
csv-location: deployments/app/isolation-1.0-SNAPSHOT.jar/

"%test":
  quarkus:
    flyway:
      locations: test_db/migration
      sql-migration-prefix: test_
    datasource:
      jdbc:
        url: jdbc:h2:mem:default
      db-kind: h2
  #    driver: org.h2.driver
     # username: postgres
    #  password: password
    hibernate-orm:
      database:
        generation:
          create-schemas: true
  csv-location: /
